- bedtools >=2.31
- figtree >=1.4.4
- gubbins >=3.3
- iqtree >=2.2.5,<3
- samtools >=1.17
- snp-dists >=0.8.2
- bowtie2 >=2.5.1
- minimap2 >=2.26
- seqkit >=2.3.1
- trimmomatic >=0.39
- beautifulsoup4 *
- biopython *
- matplotlib-base *
- numpy *
- pandas >=2.1
- pulp <2.8
- pyvcf3 *
- pyyaml *
- setuptools <82
- snakemake-minimal >=7.32.4,<8
- upsetplot >=0.8
- yattag *
- pip *
- pytest *
- pip
- pip:
  - -e .
